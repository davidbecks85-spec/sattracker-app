name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - uses: actions/checkout@v4

    - name: Prepare Android SDK Dependencies & AIDL
      run: |
        apt-get update && apt-get install -y aidl
        # Crea la cartella SDK e accetta le licenze
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0
        # Collega l'eseguibile aidl di sistema dove Buildozer si aspetta di trovarlo
        cp $(which aidl) ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl || true

    - name: Build APK with Buildozer
      env:
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SatTrackerPro-APK
        path: bin/*.apk
