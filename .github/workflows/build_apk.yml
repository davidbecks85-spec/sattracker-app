name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev ffmpeg libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good autoconf libtool pkg-config aidl
        pip install --upgrade pip setuptools
        pip install "buildozer<3.0.0" "cython<3.0.0"

    - name: Setup Android SDK Tools (Fix sdkmanager & aidl)
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0
        
        # Download commandlinetools ufficiali Google
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        cp -r cmdline-tools/* ~/.buildozer/android/platform/android-sdk/tools/ || true
        rm -rf cmdline-tools cmdline-tools.zip

        # Copy aidl
        cp $(which aidl) ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl || true

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SatTrackerPro-APK
        path: bin/*.apk
